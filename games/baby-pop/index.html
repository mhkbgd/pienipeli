<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit + no zoom keeps toddler taps from zooming the page -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Baby Pop! Free Balloon Popping Game for Babies &amp; Toddlers, No Ads | Pienipeli</title>
  <meta name="description" content="Play Baby Pop free online: a gentle balloon popping game for babies and toddlers (ages 1–4). No ads, no download, works on phone, tablet and computer. Tap, swipe or press any key!">
  <link rel="canonical" href="https://pienipeli.fi/games/baby-pop/">
  <meta name="theme-color" content="#bfe6ff">
  <link rel="icon" href="../../assets/img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="../../assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Add to Home Screen: opens straight into this game, full screen (see manifest.webmanifest) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Baby Pop">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pienipeli">
  <meta property="og:title" content="Baby Pop! Free balloon popping game for babies, no ads">
  <meta property="og:description" content="A gentle, free balloon popping game for babies and toddlers. No ads, no download.">
  <meta property="og:url" content="https://pienipeli.fi/games/baby-pop/">
  <meta property="og:image" content="https://pienipeli.fi/assets/img/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="../../assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "VideoGame",
        "@id": "https://pienipeli.fi/games/baby-pop/#game",
        "name": "Baby Pop!",
        "url": "https://pienipeli.fi/games/baby-pop/",
        "description": "A free, ad-free balloon popping game for babies and toddlers. Tap, swipe or press any key to pop smiley balloons into sparkles and happy sounds.",
        "image": "https://pienipeli.fi/assets/img/og-image.png",
        "genre": ["Educational", "Casual", "Kids"],
        "gamePlatform": ["Web browser", "Mobile", "Tablet", "Desktop"],
        "applicationCategory": "Game",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "audience": { "@type": "PeopleAudience", "suggestedMinAge": 1, "suggestedMaxAge": 4 },
        "publisher": { "@type": "Organization", "name": "Pienipeli", "url": "https://pienipeli.fi/" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Pienipeli", "item": "https://pienipeli.fi/" },
          { "@type": "ListItem", "position": 2, "name": "Baby Pop!", "item": "https://pienipeli.fi/games/baby-pop/" }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <!-- Page heading + description for screen readers (and search engines); the game itself is visual -->
  <h1 class="sr-only">Baby Pop! A free balloon popping game for babies and toddlers</h1>
  <p class="sr-only">
    Tap, swipe or press any key to pop smiley balloons into sparkles, hearts and happy sounds.
    Free to play online, no ads, nothing to download. From <a href="../../index.html">Pienipeli</a>.
  </p>

  <!-- Sky decoration: sun, rainbow, stars, clouds, hills -->
  <div class="sky" aria-hidden="true">
    <div id="stars"></div>
    <div class="sun"><i></i></div>
    <div class="rainbow-arc"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="hill h1"></div>
    <div class="hill h2"></div>
  </div>

  <!-- Balloons live here -->
  <main id="stage" aria-label="Baby Pop! Tap the balloons"></main>

  <!-- Sparkles, hearts and words live here -->
  <div id="fx" aria-hidden="true"></div>

  <!-- Corner buttons -->
  <a id="homeBtn" class="round-btn left" href="../../index.html" aria-label="More games" title="More games">🏠</a>
  <button id="restartBtn" class="round-btn right" aria-label="Restart" title="Restart">🔄</button>

  <!-- Pop counter (top centre) -->
  <div class="counter" id="counter" role="status" aria-label="Balloons popped: 0">
    <span class="counter-icon" aria-hidden="true">🎈</span><span id="count" aria-hidden="true">0</span>
  </div>

  <!-- Bottom control pill: sound + speed + full screen -->
  <div class="controls">
    <button id="muteBtn" class="round-btn" aria-label="Mute sound" title="Sound on/off">🔊</button>
    <button id="slowBtn" class="round-btn" aria-label="Slower" title="Slower">🐢</button>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <button id="fastBtn" class="round-btn" aria-label="Faster" title="Faster">🐇</button>
    <button id="fsBtn" class="round-btn" aria-label="Full screen" title="Full screen">⛶</button>
  </div>

  <script src="../../assets/js/app.js"></script>
  <script src="script.js"></script>
</body>
</html>
